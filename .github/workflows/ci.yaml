name: qr_code_ci

on:
  push:
    branches: [main]

jobs:
  # first job is run tests
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Server/requirements.txt

      - name: Run tests
        run: pytest Server/test_main.py

        # second job is building the app and pushing it to docker hub
  test-client:
    runs-on: 

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: your-dockerhub-username/qr-code-api:latest, your-dockerhub-username/qr-code-frontend:latest
